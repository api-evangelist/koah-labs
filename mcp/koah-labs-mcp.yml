- name: create_publisher
  description: Create a publisher under the authenticated publisher team account.
  source_operation: POST https://app.koah.ai/api/publishers
  inputs:
  - name
  - reference_id
  write: true
- name: list_publishers
  description: List all publishers under the authenticated publisher team account.
  source_operation: GET https://app.koah.ai/api/publishers
  inputs: []
  write: false
- name: get_publisher
  description: Retrieve a single publisher by id, including its query selectors.
  source_operation: GET https://app.koah.ai/api/publishers/:id
  inputs:
  - id
  write: false
- name: update_publisher
  description: Update a publisher's mutable fields.
  source_operation: PATCH https://app.koah.ai/api/publishers/:id
  inputs:
  - id
  - name
  write: true
- name: get_team_report
  description: Fetch daily performance metrics across the whole publisher team for a date range of up
