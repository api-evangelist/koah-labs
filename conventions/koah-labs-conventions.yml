request_tracing:
  request_id_header: x-request-id
  documented: false
  observed: true
  supported: undocumented-but-present
  method: probed
  evidence: >-
    An unauthenticated GET https://app.koah.ai/api/publishers on 2026-08-13
    returned HTTP 401 carrying x-request-id (a UUID) and x-runtime (seconds).
    Neither header appears anywhere in the published API reference, so an agent
    has no documented contract to rely on them — they are recorded here as an
    observed runtime property, not as a provider commitment.
  observed_headers: [x-request-id, x-runtime]
