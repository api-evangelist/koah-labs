aid: koah-labs
name: Koah Labs
description: 'Koah Labs operates Koah, an advertising network purpose-built for AI applications. It
  ships two products: an Ad SDK that lets publishers monetize chat and agent experiences with native,
  intent-matched ad formats (action card, image card, poll, expandable, catalog, side rail) across
  JavaScript, React, React Native, Flutter, iOS and Android; and Conversion Tracking, a pixel that lets
  advertisers measure ROI across nine standard event types. A beta REST API at app.koah.ai/api lets
  publisher teams create and manage publishers programmatically and pull daily performance reports
  (queries, fill rate, impressions, clicks, CTR, eCPC, eCPM, revenue). Koah publishes agent-native
  developer surfaces including llms.txt on both its marketing and docs hosts and a first-party Claude
  Agent Skill for integration.'
